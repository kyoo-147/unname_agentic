[package]
name = "mirror-pdf-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
reference-shell = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "mirror-pdf-desktop"
path = "src/main.rs"
required-features = ["reference-shell"]

[[bin]]
name = "pdf-workspace-host"
path = "src/bin/pdf_workspace_host.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
html-escape = "0.2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }
windows = { version = "0.62", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Security_Credentials", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
