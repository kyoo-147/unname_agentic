<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e5ebe4">
<title data-i18n="appTitle">Mirror — hiểu thêm một chút</title>
<script>
  try {
    var saved = localStorage.getItem('mirror.locale');
    if (saved === 'vi' || saved === 'en' || saved === 'zh') document.documentElement.lang = saved;
  } catch {
    /* storage may be unavailable; keep the default locale */
  }
</script>
</head>
<body>
<a class="skip-link" href="#app" data-i18n="skipToContent">Skip to main content</a>
<div id="app" tabindex="-1"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
