name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
        with:
          version: 10
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Committed imports resolve
        timeout-minutes: 5
        run: node scripts/check-committed-imports.mjs
      - name: Extension tests
        timeout-minutes: 10
        run: pnpm test:extension
      - name: Typecheck
        timeout-minutes: 5
        run: pnpm typecheck
      - name: Build extension viewer
        timeout-minutes: 10
        run: pnpm build
      - name: Check shipped artifacts
        timeout-minutes: 5
        run: pwsh -File scripts/verify-release.ps1 -ArtifactsOnly
      - name: Validate native packaging and registration contracts
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('scripts/package-native.ps1', 'scripts/install-native-host.ps1', 'scripts/verify-release.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file parse errors: $($errors -join '; ')" }
          }
          pnpm exec vitest run --config extension/vitest.config.ts extension/tests/release-scripts.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native packaging/registration contract tests failed.' }
          Write-Output 'Contract validation only. No native artifacts, signing, registration, or Chrome host E2E are claimed.'

  native:
    # Manual only, and honest about what it does. The GPUI shell needs tens of GB
    # of free disk (docs/roadmap.md: the D: drive had ~3.2 GB free and could not
    # build the target) plus a Visual Studio C++ Build Tools install carrying the
    # MSVC x64 toolchain and the Windows SDK, entered through VsDevCmd
    # -arch=x64 -host_arch=x64 as scripts/build-shell.ps1 does. Hosted runners do
    # not ship that combination, so this job checks the preconditions and names
    # what is missing instead of pretending the shell was built.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Check native build preconditions
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $problems = [System.Collections.Generic.List[string]]::new()

          $workspace = if ($env:RUNNER_WORKSPACE) { $env:RUNNER_WORKSPACE } elseif ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $drive = (Split-Path -Qualifier $workspace).TrimEnd(':')
          $freeGb = [math]::Round((Get-PSDrive -Name $drive).Free / 1GB, 1)
          if ($freeGb -lt 20) { $problems.Add("only $freeGb GB free on ${drive}:; the GPUI target needs tens of GB") }

          $cargo = Get-Command cargo -ErrorAction SilentlyContinue
          if (-not $cargo) { $problems.Add('cargo is not on PATH; install the pinned Rust toolchain') }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msvc = $null
          if (Test-Path -LiteralPath $vswhere) {
              $msvc = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          if (-not $msvc) { $problems.Add('no Visual Studio install with Microsoft.VisualStudio.Component.VC.Tools.x86.x64') }

          $cargoVersion = if ($cargo) { (& cargo --version | Out-String).Trim() } else { 'missing' }
          $msvcPath = if ($msvc) { $msvc } else { 'missing' }
          [pscustomobject]@{ FreeDiskGb = $freeGb; Cargo = $cargoVersion; Msvc = $msvcPath } | Format-List | Out-String | Write-Output

          if ($problems.Count -gt 0) {
              foreach ($problem in $problems) { Write-Output "::error::$problem" }
              Write-Output 'Preconditions are not met. This job reports them; it never builds the shell.'
              exit 1
          }
          Write-Output 'Preconditions look met. This job still does not build the shell: run pwsh -File scripts/build-shell.ps1 -Release on a provisioned Windows machine for the gate evidence.'
